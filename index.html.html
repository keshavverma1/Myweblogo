<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MacBook Opener</title>
<style>
  :root{
    --bg-1:#0d0f12;
    --bg-2:#1a1d22;
    --metal-1:#e8e9eb;
    --metal-2:#c9cbce;
    --metal-3:#9a9da2;
    --metal-dark:#54565c;
    --screen-black:#050506;
    --accent:#6ea8fe;
    --accent-glow:#8fc2ff;
    --text-soft:#8b8f96;
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:
     transparent;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .stage{
    height:100%;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    perspective:1800px;
    gap:48px;
    padding:24px;
  }

  .caption{
    text-align:center;
    color:var(--text-soft);
    font-size:14px;
    letter-spacing:0.02em;
    max-width:320px;
    line-height:1.5;
    transition:opacity .4s ease;
  }
  .caption b{color:#d7d9dc; font-weight:600;}

  /* ---------- Laptop ---------- */
  .laptop{
    position:relative;
    width:min(72vw, 460px);
    aspect-ratio:16/11;
    transform-style:preserve-3d;
    transform:rotateX(6deg);
  }

  .base{
    position:absolute;
    left:0; right:0; bottom:0;
    height:14%;
    border-radius:10px 10px 16px 16px;
    background:linear-gradient(180deg,var(--metal-1) 0%, var(--metal-2) 45%, var(--metal-3) 100%);
    box-shadow:
      0 2px 0 rgba(255,255,255,.5) inset,
      0 -6px 10px rgba(0,0,0,.25) inset,
      0 18px 40px rgba(0,0,0,.55);
    transform-style:preserve-3d;
  }
  .base::after{
    /* notch */
    content:"";
    position:absolute;
    left:50%; top:0;
    transform:translate(-50%,-40%);
    width:15%; height:40%;
    background:var(--metal-2);
    border-radius:0 0 8px 8px;
    box-shadow:0 1px 2px rgba(0,0,0,.2) inset;
  }

  .lid-pivot{
    position:absolute;
    left:4%; right:4%;
    bottom:12.5%;
    height:82%;
    transform-style:preserve-3d;
    transform-origin:50% 100%;
    transform:rotateX(90deg);
    transition:transform 1.1s cubic-bezier(.22,1,.36,1);
  }
  .laptop.open .lid-pivot{
    transform:rotateX(0deg);
  }

  .lid{
    position:absolute;
    inset:0;
    border-radius:12px 12px 4px 4px;
    background:linear-gradient(160deg,var(--metal-1) 0%, var(--metal-2) 55%, var(--metal-3) 100%);
    transform-style:preserve-3d;
    box-shadow:
      0 1px 0 rgba(255,255,255,.5) inset,
      0 20px 40px rgba(0,0,0,.45);
  }
  .lid-logo{
    position:absolute;
    left:50%; top:38%;
    transform:translate(-50%,-50%);
    width:20%;
    opacity:.5;
    filter:grayscale(1) brightness(1.6) contrast(.9);
    transition:opacity .6s ease .1s;
  }
  .laptop.open .lid-logo{ opacity:0; }
  .lid-logo img{ width:100%; display:block; }

  .screen-frame{
    position:absolute;
    inset:0;
    border-radius:12px 12px 4px 4px;
    background:#0a0a0c;
    padding:3.2%;
    transform:rotateY(0deg) translateZ(1px);
    backface-visibility:hidden;
    /* front face of lid, only visible once opened enough conceptually; keep simple */
  }
  .screen{
    position:relative;
    width:100%;
    height:100%;
    border-radius:4px;
    background:var(--screen-black);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .screen .cam{
    position:absolute;
    top:1.5%;
    left:50%;
    transform:translateX(-50%);
    width:6px;
    height:6px;
    border-radius:50%;
    background:#151517;
    box-shadow:0 0 0 1px #000;
  }

  .screen-glow{
    position:absolute;
    inset:0;
    background:radial-gradient(circle at 50% 45%, #10151c 0%, #05060a 70%);
    opacity:0;
    transition:opacity 1s ease .5s;
  }
  .laptop.open .screen-glow{ opacity:1; }

  .screen-logo{
    position:relative;
    width:58%;
    opacity:0;
    transform:scale(.7);
    transition:opacity .9s ease .9s, transform .9s cubic-bezier(.2,1.4,.4,1) .9s;
    filter:drop-shadow(0 0 18px rgba(110,168,254,.35));
  }
  .laptop.open .screen-logo{
    opacity:1;
    transform:scale(1);
  }
  .screen-logo img{ width:100%; display:block; }

  .keyboard-deck{
    position:absolute;
    left:0; right:0; top:0;
    height:100%;
    border-radius:10px 10px 16px 16px;
    background:linear-gradient(180deg,var(--metal-2) 0%, var(--metal-1) 12%, var(--metal-2) 100%);
    transform-style:preserve-3d;
  }
  .kb-well{
    position:absolute;
    left:8%; right:8%; top:14%; bottom:22%;
    background:linear-gradient(180deg,#3c3e42,#28292c);
    border-radius:4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4) inset;
    display:grid;
    grid-template-rows:repeat(4,1fr);
    gap:2.5%;
    padding:5%;
  }
  .kb-row{ display:flex; gap:2.5%; }
  .kb-row span{
    flex:1;
    background:#1c1d20;
    border-radius:2px;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
  }
  .trackpad{
    position:absolute;
    left:32%; right:32%; bottom:6%; top:80%;
    background:linear-gradient(180deg,#d7d9dc,#c3c5c8);
    border-radius:4px;
    box-shadow:0 1px 2px rgba(0,0,0,.25) inset;
  }

  /* ---------- Power button ---------- */
  .power-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .power-btn{
    position:relative;
    width:78px;
    height:78px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #3a3d43, #1b1c1f 70%);
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 6px 0 #0a0a0b,
      0 10px 18px rgba(0,0,0,.55);
    transform:translateY(0);
    transition:transform .12s ease, box-shadow .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .power-btn:active{
    transform:translateY(4px);
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 2px 0 #0a0a0b,
      0 4px 10px rgba(0,0,0,.5);
  }
  .power-btn svg{
    width:26px; height:26px;
    stroke:var(--metal-3);
    transition:stroke .4s ease, filter .4s ease;
  }
  .power-btn.on svg{
    stroke:var(--accent-glow);
    filter:drop-shadow(0 0 6px var(--accent));
  }
  .power-btn.on{
    box-shadow:
      0 1px 0 rgba(255,255,255,.08) inset,
      0 6px 0 #0a0a0b,
      0 10px 18px rgba(0,0,0,.55),
      0 0 22px rgba(110,168,254,.35);
  }
  .power-label{
    font-size:11px;
    letter-spacing:.08em;
    color:var(--text-soft);
    user-select:none;
  }

  @media (prefers-reduced-motion: reduce){
    .lid-pivot, .screen-glow, .screen-logo, .power-btn { transition-duration:.01ms !important; }
  }
</style>
</head>

  <div class="power-wrap">
    <button class="power-btn" id="powerBtn" aria-label="Power on / off">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v8"/>
        <path d="M6.5 6.5a8 8 0 1 0 11 0"/>
      </svg>
    </button>
    <div class="power-label" id="label">ON</div>
  </div>

</div>

<script>
  const laptop = document.getElementById('laptop');
  const btn = document.getElementById('powerBtn');
  const label = document.getElementById('label');
  let open = false;

  function setOpen(v){
    open = v;
    laptop.classList.toggle('open', open);
    btn.classList.toggle('on', open);
    label.textContent = open ? 'OFF' : 'ON';
  }

  btn.addEventListener('click', () => setOpen(!open));

  // Laptop starts open with the logo already showing.
  window.addEventListener('DOMContentLoaded', () => setOpen(true));
</script>
